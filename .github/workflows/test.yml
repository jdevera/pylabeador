name: Test

on:
  workflow_call:
    inputs:
      upload-coverage:
        required: false
        type: boolean
        default: false
        description: "Whether to upload coverage to Codecov"
      upload-artifacts:
        required: false
        type: boolean
        default: false
        description: "Whether to upload build artifacts"
    secrets:
      CODECOV_TOKEN:
        required: false
        description: "Codecov token for uploading coverage"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Lint with Ruff
        run: uv run --locked ruff check .

      - name: Check format with Ruff
        run: uv run --locked ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check types with mypy
        run: uv run --locked --isolated --with mypy --group dev mypy .

      - name: Check types with ty
        run: uv run --locked --isolated --with ty --group dev ty check . --output-format concise

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Run tests
        env:
          PYTHONPATH: src
          HYPOTHESIS_PROFILE: ci
        run: uv run --locked pytest --cov=src/pylabeador --cov-report=xml --junitxml=junit.xml -o junit_family=legacy test

      - name: Upload coverage to Codecov
        if: inputs.upload-coverage && matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ inputs.upload-coverage && matrix.python-version == '3.13' && !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: ${{ inputs.upload-coverage && matrix.python-version == '3.13' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: Upload junit artifacts
        if: ${{ inputs.upload-coverage && matrix.python-version == '3.13' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    if: inputs.upload-artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and setup the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: false
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Build package
        run: uv build --no-build-isolation

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
