name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      upload-coverage: true
      upload-artifacts: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
